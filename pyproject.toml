[project]
name = "webhook-sync-demo"
version = "1.0.0"
description = "Reliable Stripe webhook sync with retries and an admin dashboard (demo)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",  # assert is how pytest works
    "S311",  # random is only used for backoff jitter, not security
    "S608",  # SQL is built from fixed fragments; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test-only fake secrets
"app/synthetic.py" = ["S105"]
